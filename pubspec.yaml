name: mousa_store
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  intl: ^0.20.2
  dio: ^5.9.1
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  cached_network_image: ^4.0.4
  get_it: ^9.2.0
  connectivity_plus: ^7.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  awesome_notifications: ^0.12.1
  share_plus: ^13.2.0
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  fpdart: ^1.2.0
  internet_connection_checker_plus: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.16.1
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/on_boarding/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
