name: mousa_store
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  smooth_page_indicator: ^3.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  phone_text_field: ^2.0.0
  carousel_slider: ^5.1.2
  dio: ^5.9.1
  otp_text_field: ^1.1.3
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  cached_network_image: ^4.0.4
  skeletonizer: ^3.0.0
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.0
  connectivity_plus: ^7.0.0
  internet_state_manager: ^1.10.1+3
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  awesome_notifications: ^0.12.1
  share_plus: ^13.2.0
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  photo_view: ^0.15.0
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  fpdart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.16.1
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/on_boarding/
    - assets/images/
    - assets/icons/

